minimumReleaseAge: 1440
blockExoticSubdeps: true
packages:
  - packages/*
  - apps/*
allowBuilds:
  lefthook: true
  unrs-resolver: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@syntopica/quality-config@0.12.0 || 0.16.0'
  - '@syntopica/prettier-config@0.3.0'
  - '@syntopica/eslint-config'
  - 'eslint-plugin-code-policy'
overrides:
  # eslint-plugin-boundaries pins handlebars to 4.7.9, which carries three
  # advisories (GHSA-xw65-4hp5-5hc7, GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f).
  'handlebars@<4.7.10': ^4.7.10 # via eslint-plugin-boundaries>@boundaries/elements
  # eslint-plugin-sonarjs 4.2.2 (latest) still depends on minimatch ^10.2.6,
  # which carries GHSA-g3hv-75wg-m249 (fixed in 11.0.1); no upstream release fixes it.
  'eslint-plugin-sonarjs>minimatch': ^11.0.1
  # type-coverage-core 2.31.2 (latest) allows minimatch only up to 10; same advisory.
  'type-coverage-core>minimatch': ^11.0.1
